<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tomorrow 🌿</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      font-family: Georgia, serif;
      color: #222;
    }
    .card {
      background: white;
      padding: 32px;
      max-width: 360px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      font-weight: normal;
    }
    p {
      font-size: 15px;
      line-height: 1.7;
      color: #555;
    }
    .soft {
      margin-top: 18px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hey Harsh 🐾</h1>
    <p>
      Tomorrow we go to the zoo.<br>
      Walk slow. Look around.<br>
      No rush, no pressure.
    </p>
    <p>
      Just two curious minds<br>
      and a few animals judging us.
    </p>
    <p class="soft">
      Say yes if it feels right 🌿
    </p>
  </div>
</body>
</html>

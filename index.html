<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A Zoo Story 🐘🌿</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  overflow: hidden;
}

/* BACKGROUND */
.scene {
  width: 100vw;
  height: 100vh;
  background: linear-gradient(#b8e8ff 60%, #ffe89a 40%);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FLOATING CLOUDS */
.cloud {
  position: absolute;
  font-size: 3rem;
  opacity: 0.5;
  animation: float 30s linear infinite;
}

.cloud:nth-child(1) { top: 10%; left: -10%; animation-delay: 0s;}
.cloud:nth-child(2) { top: 20%; left: -20%; animation-delay: 10s;}

@keyframes float {
  to { transform: translateX(120vw); }
}

/* CARD */
.card {
  background: #fffdf7;
  padding: 40px;
  border-radius: 24px;
  max-width: 520px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.animals {
  font-size: 3rem;
  margin-bottom: 20px;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

p {
  font-size: 1.1rem;
  line-height: 1.7;
  color: #333;
}

button {
  margin-top: 30px;
  padding: 14px 30px;
  font-size: 1rem;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #ff7aa2, #ff4f81);
  color: white;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(255,79,129,0.4);
}

/* WALKING CHARACTERS */
.walkers {
  font-size: 3rem;
  position: absolute;
  bottom: 60px;
  left: -10%;
  animation: walk 18s linear infinite;
}

@keyframes walk {
  to { left: 110%; }
}

/* HEARTS */
.heart {
  position: absolute;
  font-size: 2rem;
  animation: floatUp 3s ease forwards;
}

@keyframes floatUp {
  from { transform: translateY(0) scale(0.5); opacity: 1; }
  to { transform: translateY(-200px) scale(1.5); opacity: 0; }
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="scene">

  <div class="cloud">☁️</div>
  <div class="cloud">☁️</div>

  <div class="walkers">👦🏻👦🏽</div>

  <div class="card" id="card">
    <div class="animals" id="animals">🐘🐒</div>
    <p id="text"></p>
    <button id="btn">Next →</button>
  </div>

</div>

<script>
const slides = [
  {
    animals: "🐘🐒",
    text: `“Did you hear?” the elephant whispered.<br><br>
           “Two beautiful humans are coming today.”<br><br>
           “But…” said the monkey,<br>
           “are they seeing each other?”`
  },
  {
    animals: "🦒🦓",
    text: `The zoo buzzed with curiosity.<br><br>
           Soft steps. Nervous smiles.<br>
           Two people walking without rushing.`
  },
  {
    animals: "🐼🦊",
    text: `Sometimes the best connections<br>
           don’t arrive loudly.<br><br>
           They arrive gently.`
  },
  {
    animals: "🐘❤️🐘",
    text: `So let’s ask properly…<br><br>
           Would you go on a zoo date with me?`
  },
  {
    animals: "💖💖💖",
    text: `Okay.<br><br>
           Be ready tomorrow 🐘<br><br>
           Oh — one last thing…<br><br>
           I really liked our first date.<br>
           I want to know you better —<br>
           slowly, honestly.<br><br>
           — Devang`
  }
];

let index = 0;
const text = document.getElementById("text");
const animals = document.getElementById("animals");
const btn = document.getElementById("btn");

function render() {
  text.innerHTML = slides[index].text;
  animals.innerHTML = slides[index].animals;

  if (index === 3) {
    btn.innerText = "YES 💗";
  } else if (index === slides.length - 1) {
    btn.classList.add("hidden");
  } else {
    btn.innerText = "Next →";
  }
}

btn.addEventListener("click", () => {
  if (index === 3) explodeHearts();
  index++;
  render();
});

function explodeHearts() {
  for (let i = 0; i < 25; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerText = "💖";
    h.style.left = Math.random() * 100 + "vw";
    h.style.top = "70%";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3000);
  }
}

render();
</script>

</body>
</html>
